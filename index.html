<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎮 ALGOARCADE — Master the Arcane Arts</title>
<meta name="description" content="Retro-arcade gamified learning hub for Data Structures, Algorithms & Cryptographic Architecture." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --void:#0a0b10; --deep:#050508; --card:#0f1018; --border:#1a1c28; --edge:#242838;
  --cyan:#00f5d4; --purple:#9d4edd; --pink:#f72585; --gold:#ffd166; --green:#39ff14;
  --ink:#e8eaf6; --dim:#8b90a8;
  --fx:cubic-bezier(.2,.9,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--deep); color:var(--ink);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  min-height:100vh; overflow-x:hidden; position:relative;
  -webkit-font-smoothing:antialiased;
}
/* ---------- ambient layers ---------- */
body::before{ /* grid */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    linear-gradient(rgba(0,245,212,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,212,.045) 1px,transparent 1px);
  background-size:44px 44px;
  animation:gridPulse 5s ease-in-out infinite;
}
body::after{ /* scanlines + vignette */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.72) 100%);
  animation:scan 9s linear infinite;
}
@keyframes scan{to{background-position:0 300px,0 0}}
@keyframes gridPulse{0%,100%{opacity:.5}50%{opacity:1}}
.wrap{position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:0 20px}

/* ---------- typography ---------- */
.pixel{font-family:'Press Start 2P',cursive; letter-spacing:.5px}
.silk{font-family:'Silkscreen',cursive}

/* ---------- header ---------- */
header{padding:56px 0 40px; text-align:center; position:relative}
.brand{font-size:clamp(22px,5.2vw,50px); line-height:1.35; display:inline-block; position:relative; color:#fff}
.brand .gl{display:inline-block;position:relative}
.brand .gl::before,.brand .gl::after{
  content:attr(data-t); position:absolute; inset:0; opacity:.85;
}
.brand .gl::before{color:var(--pink); animation:gl1 3.6s infinite steps(1)}
.brand .gl::after{color:var(--cyan); animation:gl2 3.6s infinite steps(1)}
@keyframes gl1{0%,92%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}93%{transform:translate(-3px,0);clip-path:inset(12% 0 62% 0)}96%{transform:translate(3px,0);clip-path:inset(48% 0 32% 0)}}
@keyframes gl2{0%,92%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}94%{transform:translate(3px,0);clip-path:inset(30% 0 50% 0)}97%{transform:translate(-3px,0);clip-path:inset(66% 0 14% 0)}}
.tagline{color:var(--cyan); margin-top:18px; font-size:clamp(10px,1.5vw,14px); text-shadow:0 0 14px rgba(0,245,212,.5); line-height:1.9}

/* ---------- HUD / stats ---------- */
.hud{
  margin:34px auto 0; display:grid; grid-template-columns:1fr; gap:14px; max-width:900px;
}
@media(min-width:720px){.hud{grid-template-columns:auto 1fr auto}}
.hud-box{
  border:3px solid var(--border); background:rgba(15,16,24,.75); padding:14px 18px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.stat-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center}
.stat{
  font-size:10px; padding:9px 12px; border:2px solid rgba(0,245,212,.35);
  background:rgba(0,245,212,.05); color:var(--cyan); white-space:nowrap;
}
.stat b{color:#fff; margin-left:6px; text-shadow:0 0 10px var(--cyan)}
.stat.p{color:var(--purple); border-color:rgba(157,78,221,.4); background:rgba(157,78,221,.06)}
.stat.p b{text-shadow:0 0 10px var(--purple)}
.stat.k{color:var(--gold); border-color:rgba(255,209,102,.4); background:rgba(255,209,102,.06)}
.stat.k b{text-shadow:0 0 10px var(--gold)}

.lvl{display:flex; align-items:center; gap:12px; justify-content:center}
.lvl-badge{
  font-size:9px; padding:9px 11px; border:2px solid var(--gold); color:var(--gold);
  background:rgba(255,209,102,.08); white-space:nowrap; animation:pulseG 2.4s infinite;
}
@keyframes pulseG{0%,100%{box-shadow:0 0 8px rgba(255,209,102,.3)}50%{box-shadow:0 0 22px rgba(255,209,102,.65)}}
.bar{flex:1; height:16px; background:var(--deep); border:2px solid var(--border); position:relative; overflow:hidden; min-width:120px}
.bar>i{position:absolute; inset:0 auto 0 0; width:0%; background:linear-gradient(90deg,var(--cyan),var(--purple) 55%,var(--pink)); transition:width .6s var(--fx); box-shadow:0 0 16px rgba(0,245,212,.55)}
.bar>span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#fff; text-shadow:0 1px 3px #000; letter-spacing:.5px}

/* ---------- buttons ---------- */
.btn{
  font-family:'Press Start 2P',cursive; font-size:10px; cursor:pointer;
  padding:15px 20px; border:3px solid var(--cyan); color:var(--cyan); background:rgba(0,245,212,.05);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:all .18s var(--fx); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--cyan); color:var(--deep); box-shadow:0 0 24px rgba(0,245,212,.6)}
.btn:active:not(:disabled){transform:translate(2px,2px)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.purple{border-color:var(--purple); color:var(--purple); background:rgba(157,78,221,.06)}
.btn.purple:hover:not(:disabled){background:var(--purple); color:#fff; box-shadow:0 0 24px rgba(157,78,221,.6)}
.btn.pink{border-color:var(--pink); color:var(--pink); background:rgba(247,37,133,.06)}
.btn.pink:hover:not(:disabled){background:var(--pink); color:#fff; box-shadow:0 0 24px rgba(247,37,133,.6)}
.btn.gold{border-color:var(--gold); color:var(--gold); background:rgba(255,209,102,.06)}
.btn.gold:hover:not(:disabled){background:var(--gold); color:#000; box-shadow:0 0 24px rgba(255,209,102,.6)}
.btn.sm{padding:10px 13px; font-size:8px; border-width:2px}
.btn:focus-visible{outline:2px solid #fff; outline-offset:3px}

/* ---------- track section ---------- */
.track{margin:64px 0}
.track-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:26px; flex-wrap:wrap}
.track-ico{
  font-size:30px; width:62px; height:62px; flex:0 0 auto; display:grid; place-items:center;
  border:3px solid var(--cyan); background:rgba(0,245,212,.07);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 8px) 100%,0 100%,0 9px);
}
.track.purple .track-ico{border-color:var(--purple); background:rgba(157,78,221,.08)}
.track h2{font-size:clamp(13px,2.4vw,20px); line-height:1.5}
.track .sub{color:var(--dim); font-size:12px; margin-top:9px; line-height:1.8; max-width:62ch}
.track-meta{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap}

/* ---------- module grid / cards ---------- */
.grid{display:grid; gap:22px; grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{
  position:relative; background:linear-gradient(160deg,rgba(15,16,24,.96),rgba(10,11,16,.96));
  border:2px solid var(--border); padding:24px 22px; cursor:pointer; overflow:hidden;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:transform .25s var(--fx), border-color .25s, box-shadow .25s;
  display:flex; flex-direction:column; gap:13px; min-height:280px;
}
.card::after{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--cyan),var(--purple),var(--pink));
  opacity:.55; transition:opacity .25s;
}
.card:hover:not(.locked){transform:translateY(-7px); border-color:rgba(0,245,212,.55); box-shadow:0 14px 46px rgba(0,245,212,.16)}
.card:hover:not(.locked)::after{opacity:1}
.card.locked{cursor:not-allowed; filter:grayscale(.85); opacity:.55}
.card.locked .lock{
  position:absolute; inset:0; display:grid; place-items:center; gap:8px; z-index:3;
  background:rgba(5,5,8,.8); font-size:11px; color:var(--dim); text-align:center; padding:20px;
}
.card.done{border-color:rgba(57,255,20,.5)}
.card.done::after{background:linear-gradient(180deg,var(--green),var(--cyan)); opacity:1}
.card-top{display:flex; align-items:center; gap:12px}
.num{font-size:9px; color:var(--gold); border:2px solid rgba(255,209,102,.4); padding:6px 8px}
.cico{font-size:25px; margin-left:auto}
.card h3{font-size:12px; line-height:1.6}
.card p{font-size:12px; color:var(--dim); line-height:1.85; flex:1}
.badges{display:flex; gap:7px; flex-wrap:wrap}
.bdg{font-size:8px; padding:5px 8px; border:2px solid; letter-spacing:.5px; font-family:'Press Start 2P',cursive}
.bdg.beginner{color:var(--green); border-color:rgba(57,255,20,.45); background:rgba(57,255,20,.08)}
.bdg.intermediate{color:var(--gold); border-color:rgba(255,209,102,.45); background:rgba(255,209,102,.08)}
.bdg.advanced{color:var(--pink); border-color:rgba(247,37,133,.45); background:rgba(247,37,133,.08)}
.bdg.legendary{color:var(--purple); border-color:rgba(157,78,221,.5); background:rgba(157,78,221,.1); animation:pulseP 2s infinite}
@keyframes pulseP{0%,100%{box-shadow:0 0 6px rgba(157,78,221,.35)}50%{box-shadow:0 0 20px rgba(157,78,221,.8)}}
.bdg.xp{color:var(--cyan); border-color:rgba(0,245,212,.45); background:rgba(0,245,212,.08)}
.rewards{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:10px; padding-top:11px; border-top:2px dashed var(--border); flex-wrap:wrap}
.rewards .xpval{color:var(--gold)}
.rewards .u{color:var(--purple)}
.pbar{height:8px; background:var(--deep); border:2px solid var(--border); position:relative; overflow:hidden}
.pbar>i{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--cyan),var(--green)); transition:width .5s var(--fx)}
.mprog{display:flex; align-items:center; gap:9px; font-size:8px; color:var(--dim)}

/* ---------- modal ---------- */
.backdrop{position:fixed; inset:0; background:rgba(2,2,5,.86); backdrop-filter:blur(7px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.win{
  width:100%; max-width:960px; max-height:92vh; display:flex; flex-direction:column;
  background:var(--card); border:3px solid var(--cyan);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  box-shadow:0 0 70px rgba(0,245,212,.22); animation:pop .28s var(--fx);
}
@keyframes pop{from{transform:scale(.94) translateY(14px); opacity:0}to{transform:none; opacity:1}}
.win-bar{display:flex; align-items:center; gap:9px; padding:13px 18px; border-bottom:2px solid var(--border); background:rgba(5,5,8,.6)}
.dot{width:11px; height:11px; border-radius:50%}
.win-title{font-size:9px; margin-left:10px; color:var(--cyan); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.x{margin-left:auto; background:none; border:2px solid var(--border); color:var(--dim); width:32px; height:32px; cursor:pointer; font-size:15px; line-height:1; transition:.2s}
.x:hover{border-color:var(--pink); color:var(--pink)}
.win-body{overflow-y:auto; padding:24px}
.tabs{display:flex; gap:0; border-bottom:2px solid var(--border); padding:0 18px; overflow-x:auto; flex-shrink:0}
.tab{
  font-family:'Press Start 2P',cursive; font-size:9px; padding:17px 15px; background:none; border:none;
  border-bottom:4px solid transparent; color:var(--dim); cursor:pointer; white-space:nowrap; transition:.2s;
}
.tab:hover{color:var(--cyan)}
.tab.on{color:var(--cyan); border-bottom-color:var(--cyan); text-shadow:0 0 12px var(--cyan)}

/* ---------- modal content ---------- */
.sec{margin-bottom:26px}
.sec-t{font-size:10px; color:var(--purple); margin-bottom:14px; padding-bottom:9px; border-bottom:2px solid rgba(157,78,221,.28)}
.lesson{display:flex; gap:13px; padding:14px; border:2px solid var(--border); background:rgba(5,5,8,.5); margin-bottom:11px; transition:.2s; align-items:flex-start}
.lesson:hover{border-color:rgba(0,245,212,.35)}
.lesson.ok{border-color:rgba(57,255,20,.35); background:rgba(57,255,20,.04)}
.chk{
  flex:0 0 auto; width:26px; height:26px; border:2px solid var(--cyan); background:none; cursor:pointer;
  display:grid; place-items:center; color:transparent; font-size:13px; transition:.2s; padding:0;
}
.chk:hover{background:rgba(0,245,212,.14); box-shadow:0 0 14px rgba(0,245,212,.4)}
.chk.on{background:var(--green); border-color:var(--green); color:#04140b; font-weight:700}
.lesson h4{font-size:11px; line-height:1.6}
.lesson p{font-size:11px; color:var(--dim); margin-top:7px; line-height:1.8}
.lesson .meta{font-size:9px; color:var(--purple); margin-top:9px}
pre{background:var(--deep); border:2px solid var(--border); padding:15px; overflow-x:auto; font-size:11px; line-height:1.85; margin:11px 0; color:#c9d1e8; white-space:pre; tab-size:2}
pre .k{color:var(--pink)} pre .s{color:var(--green)} pre .c{color:#5a6180; font-style:italic} pre .n{color:var(--gold)} pre .f{color:var(--cyan)}
table{width:100%; border-collapse:collapse; font-size:11px; margin:11px 0}
th,td{border:2px solid var(--border); padding:10px; text-align:left; line-height:1.75}
th{background:rgba(157,78,221,.13); color:var(--purple); font-size:9px}
.tbl-wrap{overflow-x:auto}
.note{border-left:4px solid var(--gold); background:rgba(255,209,102,.06); padding:13px 15px; font-size:11px; line-height:1.85; margin:13px 0; color:#f0e2bd}
.note.cy{border-color:var(--cyan); background:rgba(0,245,212,.05); color:#c3f4ee}
.note.pk{border-color:var(--pink); background:rgba(247,37,133,.06); color:#f7c6dd}
.hint{display:none; font-size:11px; color:var(--gold); border:2px dashed rgba(255,209,102,.35); padding:13px; margin-top:11px; line-height:1.85}
.hint.show{display:block; animation:fade .2s}
.field{margin-bottom:15px}
.field label{display:block; font-size:9px; color:var(--purple); margin-bottom:9px; letter-spacing:.5px}
.field textarea,.field input{
  width:100%; background:var(--deep); border:2px solid var(--border); color:var(--cyan);
  padding:13px; font-family:'JetBrains Mono',monospace; font-size:12px; resize:vertical;
}
.field textarea:focus,.field input:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 16px rgba(0,245,212,.25)}
.modes{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.mode{font-family:'Press Start 2P',cursive; font-size:8px; padding:10px 12px; border:2px solid var(--border); background:none; color:var(--dim); cursor:pointer; transition:.2s}
.mode:hover{border-color:rgba(0,245,212,.4); color:var(--cyan)}
.mode.on{border-color:var(--cyan); color:var(--cyan); background:rgba(0,245,212,.09)}
.out{background:var(--deep); border:2px solid var(--border); padding:15px; font-size:11px; line-height:1.9; min-height:64px; color:var(--cyan); white-space:pre-wrap; word-break:break-word}
.test{display:flex; gap:11px; padding:11px 13px; border:2px solid var(--border); margin-bottom:9px; font-size:10px; align-items:flex-start; background:rgba(5,5,8,.45)}
.test.pass{border-color:rgba(57,255,20,.4); background:rgba(57,255,20,.05)}
.test.fail{border-color:rgba(247,37,133,.45); background:rgba(247,37,133,.05)}
.test .ic{font-size:14px; flex:0 0 auto}
.test .lb{flex:1; line-height:1.7}
.test .dt{color:var(--dim); font-size:9px; margin-top:5px; word-break:break-all}
.award{
  margin-top:18px; padding:17px; border:2px solid var(--gold); background:rgba(255,209,102,.08);
  text-align:center; animation:pulseG 1.6s infinite;
}
.award .t{font-size:11px; color:var(--gold)}
.award .s{font-size:10px; color:var(--dim); margin-top:9px}
.row{display:flex; gap:11px; flex-wrap:wrap; align-items:center}
.spacer{flex:1}

/* ---------- toast ---------- */
#toasts{position:fixed; right:18px; bottom:18px; z-index:200; display:flex; flex-direction:column; gap:11px; max-width:calc(100vw - 36px)}
.toast{
  background:var(--card); border:2px solid var(--gold); padding:14px 18px; min-width:230px;
  animation:slideIn .35s var(--fx); box-shadow:0 0 30px rgba(255,209,102,.25);
}
.toast.g{border-color:var(--green); box-shadow:0 0 30px rgba(57,255,20,.25)}
.toast .t{font-size:9px; font-family:'Press Start 2P',cursive; color:var(--gold); line-height:1.6}
.toast.g .t{color:var(--green)}
.toast p{font-size:10px; color:var(--dim); margin-top:8px; line-height:1.7}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}

footer{margin:80px 0 0; padding:34px 0; border-top:2px solid var(--border); text-align:center; color:var(--dim); font-size:10px; line-height:2.2}
footer .pixel{font-size:9px; color:var(--purple); margin-bottom:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--deep)}
::-webkit-scrollbar-thumb{background:rgba(157,78,221,.45);border:2px solid var(--deep)}
::-webkit-scrollbar-thumb:hover{background:rgba(0,245,212,.5)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:520px){.stat-row{justify-content:flex-start}.win-body{padding:17px}.lvl{flex-wrap:wrap}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="pixel brand"><span class="gl" data-t="ALGOARCADE">ALGOARCADE</span></div>
    <p class="tagline pixel">Master the Arcane Arts of<br/>Data Structures &amp; Cryptographic Architecture</p>

    <div class="hud">
      <div class="hud-box">
        <div class="stat-row">
          <div class="stat">QUEST LINES<b id="s-lines">12</b></div>
          <div class="stat p">XP POTENTIAL<b>∞</b></div>
          <div class="stat k">BOSS LEVEL<b>100</b></div>
        </div>
      </div>

      <div class="hud-box">
        <div class="lvl">
          <div class="lvl-badge pixel">LV <span id="s-level">1</span></div>
          <div class="bar"><i id="s-bar"></i><span class="pixel" id="s-xp">0 XP</span></div>
          <div class="stat p"><b id="s-total">0</b> TOTAL</div>
        </div>
      </div>

      <div class="hud-box">
        <div class="row" style="justify-content:center">
          <button class="btn" id="press-start">▶ PRESS START</button>
          <button class="btn purple sm" id="sound-btn" aria-pressed="true">🔊 SOUND</button>
          <button class="btn sm" id="reset-btn" style="border-color:var(--pink);color:var(--pink);background:rgba(247,37,133,.06)">⟲ RESET</button>
        </div>
      </div>
    </div>
  </header>

  <main id="tracks"></main>

  <footer>
    <div class="pixel">🎮 ALGOARCADE v1.0</div>
    <div>Progress saved locally in your browser · No servers, no tracking</div>
    <div style="margin-top:9px">12 Quest Lines · 37 Lessons · 12 Challenges · 11,150 XP Available</div>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
